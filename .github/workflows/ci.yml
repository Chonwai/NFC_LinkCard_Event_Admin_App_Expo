name: ci

on:
  push:
    branches: [main, master, develop, development]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Node version guard
        run: node scripts/require-node-version.mjs

      - name: Regenerate typed routes
        run: npm run regenerate:typed-routes

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # 能力對等登記表。Web repo 不在 CI 的 checkout 範圍內，所以這一步只驗
      # 登記表自身的一致性、App 側檔案與缺口章節；完整掃描（會抓到 Web 新增
      # 但未登記的頁面）需要兩個 repo 都在旁邊，用 npm run check:parity:full。
      - name: Parity registry
        run: npm run check:parity

      - name: Test
        run: npm test
