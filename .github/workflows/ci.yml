name: ci

on:
  push:
    branches: [main, master, develop, development]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Node version guard
        run: node scripts/require-node-version.mjs

      - name: Regenerate typed routes
        run: npm run regenerate:typed-routes

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # 2026-10-22 對等審計的結論：`tsc` + lint + 210 個測試全綠，
      # 卻有一條呼叫了數個月的路由根本不存在。這個 step 專門守那類漂移。
      # 快照是後端某個 commit 的複本；後端改路由時要重跑
      #   node scripts/check-backend-contract.mjs --refresh --backend <後端路徑>
      - name: Backend contract
        run: npm run check:contract

      - name: Test
        run: npm test
